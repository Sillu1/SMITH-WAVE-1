<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SMITH — Today's Key</title>
<style>
  body { background:#0f111a; color:#e8eaf2; font-family:Arial, sans-serif;
         display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  div   { text-align:center; }
  code  { display:block; font-size:30px; color:#00d68f; background:#171a22;
          padding:14px 26px; border-radius:12px; margin:18px auto; letter-spacing:1px; }
  p     { color:#8a92a6; font-size:14px; }
</style>
</head>
<body>
<div>
  <h2>TODAY'S KEY</h2>
  <code id="k">loading…</code>
  <p>copy this and paste it into the script window.<br>
     expires automatically at midnight (UTC)</p>
</div>
<script>
(function () {
  var d = new Date();
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  var stamp = pad(d.getUTCDate())
            + pad(d.getUTCMonth() + 1)
            + pad(d.getUTCFullYear() % 100);
  document.getElementById("k").textContent = "SMITH-WAVE-1-" + stamp;
})();
</script>
</body>
</html>
